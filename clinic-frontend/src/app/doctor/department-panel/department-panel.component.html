<div class="mx-xl-5 mx-lg-4 mx-md-3 mx-0 px-xl-5 px-4 py-4">
  <div class="modal"
       data-bs-backdrop="static"
       tabindex="-1"
       id="success-modal"
       #successModal>
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">
            <strong>
              Success!
            </strong>
          </div>
        </div>
        <div class="modal-body d-flex align-items-center">
          Department was updated.
        </div>
        <div class="modal-footer">
          <button type="button"
                  class="btn btn-primary"
                  data-bs-dismiss="modal"
                  style="min-width: 100px">
            Ok
          </button>
        </div>
      </div>
    </div>
  </div>
  <section class="section-box department-section-box mb-4 px-lg-5 px-sm-4 py-sm-4 py-3">
    <div class="heading mb-3">Department</div>
    <div class="row mb-3">
      <div class="col-2 p-0 mb-0 d-flex justify-content-end align-items-center">
        <label for="department-name" class="form-label">
          Name:
        </label>
      </div>
      <div class="col-10">
        <input type="text"
               name="department-name"
               id="department-name"
               class="form-control"
               placeholder="Department name"
               (ngModelChange)="departmentWasChanged = true"
               [(ngModel)]="department.name">
      </div>
    </div>
    <div class="row">
      <div class="col-2"></div>
      <div class="col-10">
        <div class="form-check mb-3">
          <input class="form-check-input"
                 type="checkbox"
                 value=""
                 id="auto-confirm-appointment"
                 [(ngModel)]="department.autoConfirmAppointment"
                 (ngModelChange)="departmentWasChanged = true"
                 [checked]="department?.autoConfirmAppointment">
          <label class="form-check-label" for="auto-confirm-appointment">
            Confirm appointment automatically
          </label>
        </div>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-2 p-0 d-flex justify-content-end align-items-center">
        <div class="form-label">
          Specialization:
        </div>
      </div>
      <div class="col-10 d-flex justify-content-start align-items-center">
        <div class="data-value">
          {{ department?.specialization | titlecase }}
        </div>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-2 p-0 d-flex justify-content-end align-items-center">
        <div class="form-label">
          Address:
        </div>
      </div>
      <div class="col-10 d-flex justify-content-start align-items-center">
        <div class="data-value">
          {{ department?.address | address: 'long' }}
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-2"></div>
      <div class="col-10 d-flex justify-content-start align-items-center">
        <button type="button"
                class="btn btn-primary"
                [ngClass]="{'d-none': !departmentWasChanged}"
                [disabled]="!department.name"
                (click)="updateDepartment()">
          Save
        </button>
      </div>
    </div>
  </section>
</div>
